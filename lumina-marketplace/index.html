<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#334155" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lumina" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- SEO -->
    <title>Lumina Marketplace — فروشگاه حرفه‌ای آنلاین</title>
    <meta name="description" content="فروشگاه آنلاین حرفه‌ای با تجربه خرید سریع، امن و بدون رنگارنگی اضافی. طراحی شده برای تمرکز کامل مشتری بر خرید." />
    <meta name="keywords" content="فروشگاه آنلاین، خرید حرفه‌ای، Lumina" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="/src/design-system/fonts/iranyekan.css" />

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/src/pwa/service-worker.js', { scope: '/' })
          .then((reg) => console.log('PWA Service Worker registered:', reg.scope))
          .catch((err) => console.log('PWA registration failed:', err));
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
